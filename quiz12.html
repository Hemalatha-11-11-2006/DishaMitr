<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12th Student Test - Slideshow</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #87CEEB 0%, #B0E2FF 100%);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    
    .quiz-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 700px;
      padding: 25px;
      position: relative;
    }
    
    h2 { 
      text-align: center; 
      color: #1E90FF; 
      margin-bottom: 25px;
      font-size: 28px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    
    .progress-bar {
      height: 8px;
      background: #E6F2FF;
      border-radius: 4px;
      margin-bottom: 25px;
      overflow: hidden;
    }
    
    .progress {
      height: 100%;
      background: #1E90FF;
      border-radius: 4px;
      width: 0%;
      transition: width 0.5s ease;
    }
    
    .question-counter {
      text-align: center;
      color: #4682B4;
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .question-box {
      background: #F0F8FF;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      min-height: 200px;
      border: 1px solid #B0E2FF;
    }
    
    .question-text {
      font-size: 18px;
      color: #2F4F4F;
      margin-bottom: 20px;
      font-weight: 600;
    }
    
    .options-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    
    label {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid #B0E2FF;
    }
    
    label:hover {
      background: #E6F2FF;
      border-color: #87CEEB;
      transform: translateY(-2px);
    }
    
    input[type="radio"] {
      margin-right: 12px;
      accent-color: #1E90FF;
    }
    
    .navigation-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .prev-btn {
      background: #87CEEB;
      color: white;
    }
    
    .prev-btn:hover {
      background: #5F9EA0;
      transform: translateY(-2px);
    }
    
    .next-btn {
      background: #1E90FF;
      color: white;
    }
    
    .next-btn:hover {
      background: #0066CC;
      transform: translateY(-2px);
    }
    
    .submit-btn {
      background: #4682B4;
      color: white;
      margin: 20px auto;
      display: block;
      padding: 14px 30px;
    }
    
    .submit-btn:hover {
      background: #36648B;
      transform: scale(1.05);
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .icon {
      margin-right: 8px;
      font-size: 18px;
    }
    
    /* Animation for question transitions */
    .question-box {
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Responsive design */
    @media (max-width: 600px) {
      .quiz-container {
        width: 95%;
        padding: 15px;
      }
      
      .question-box {
        padding: 15px;
        min-height: 180px;
      }
      
      button {
        padding: 10px 15px;
        font-size: 14px;
      }
      
      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h2>12th Grade Career Assessment</h2>
    
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
    
    <div class="question-counter" id="question-counter">Question 1 of 15</div>
    
    <div class="question-box">
      <div class="question-text" id="question-text"></div>
      <div class="options-container" id="options-container"></div>
    </div>
    
    <div class="navigation-buttons">
      <button class="prev-btn" id="prev-btn" disabled>
        <span class="icon">←</span> Previous
      </button>
      <button class="next-btn" id="next-btn">
        Next <span class="icon">→</span>
      </button>
    </div>
    
    <button class="submit-btn" id="submit-btn" style="display:none;">Submit Test</button>
  </div>

  <script>
    const questions12 = [
      { q:"Which activity excites you?", o:["Helping sick","Building tech","Helping society","Playing sports"], v:["doctor","engineer","social","sports"] },
      { q:"Favorite subject?", o:["Biology","Maths","Civics","PE"], v:["doctor","engineer","social","sports"] },
      { q:"Your dream career?", o:["Doctor","Engineer","Social worker","Athlete"], v:["doctor","engineer","social","sports"] },
      { q:"Best role model?", o:["Doctor","Tech founder","Activist","Player"], v:["doctor","engineer","social","sports"] },
      { q:"What inspires you?", o:["Hospital work","Robots","Helping poor","Sports"], v:["doctor","engineer","social","sports"] },
      { q:"Preferred subject?", o:["Biology","Physics","Sociology","Sports"], v:["doctor","engineer","social","sports"] },
      { q:"Favorite work?", o:["Treating","Coding","Campaigning","Training"], v:["doctor","engineer","social","sports"] },
      { q:"What makes you proud?", o:["Saving life","Innovating","Helping society","Winning match"], v:["doctor","engineer","social","sports"] },
      { q:"Choose a place:", o:["Hospital","Lab","NGO","Stadium"], v:["doctor","engineer","social","sports"] },
      { q:"Weekend plan?", o:["Medical camp","Hackathon","Volunteering","Football"], v:["doctor","engineer","social","sports"] },
      { q:"School project?", o:["Biology","Robotics","Social work","Sports event"], v:["doctor","engineer","social","sports"] },
      { q:"What would you invent?", o:["Medicine","Software","Social idea","Sports gear"], v:["doctor","engineer","social","sports"] },
      { q:"Future goal?", o:["Doctor","Engineer","Social activist","Sportsman"], v:["doctor","engineer","social","sports"] },
      { q:"Which news excites?", o:["Medical news","Tech news","Social issue","Sports news"], v:["doctor","engineer","social","sports"] },
      { q:"What defines you?", o:["Caring","Problem solver","Helper","Competitive"], v:["doctor","engineer","social","sports"] }
    ];

    let currentQuestion = 0;
    const userAnswers = new Array(questions12.length).fill(null);

    // Initialize the quiz
    function initQuiz() {
      showQuestion(currentQuestion);
      updateProgressBar();
      updateNavigationButtons();
    }

    // Display the current question
    function showQuestion(index) {
      const question = questions12[index];
      document.getElementById('question-text').textContent = question.q;
      document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions12.length}`;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      question.o.forEach((option, i) => {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'question';
        input.value = question.v[i];
        input.checked = userAnswers[index] === question.v[i];
        
        input.addEventListener('change', () => {
          userAnswers[index] = question.v[i];
          updateNavigationButtons();
        });
        
        label.appendChild(input);
        label.appendChild(document.createTextNode(option));
        optionsContainer.appendChild(label);
      });
    }

    // Update progress bar
    function updateProgressBar() {
      const progress = ((currentQuestion + 1) / questions12.length) * 100;
 document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions12.length}`;
 
    }

    // Update navigation buttons state
    function updateNavigationButtons() {
      document.getElementById('prev-btn').disabled = currentQuestion === 0;
      
      if (currentQuestion === questions12.length - 1) {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'block';
      } else {
        document.getElementById('next-btn').style.display = 'block';
        document.getElementById('submit-btn').style.display = 'none';
      }
      
      // Enable next button if current question is answered
      document.getElementById('next-btn').disabled = userAnswers[currentQuestion] === null;
    }

    // Navigate to next question
    function nextQuestion() {
      if (currentQuestion < questions12.length - 1) {
        currentQuestion++;
        showQuestion(currentQuestion);
        updateProgressBar();
        updateNavigationButtons();
      }
    }

    // Navigate to previous question
    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        showQuestion(currentQuestion);
        updateProgressBar();
        updateNavigationButtons();
      }
    }

    // Submit the test
    function submitTest() {
      // Calculate scores
      const scores = {
        doctor: 0,
        engineer: 0,
        social: 0,
        sports: 0
      };
      
      userAnswers.forEach(answer => {
        if (answer && scores.hasOwnProperty(answer)) {
          scores[answer]++;
        }
      });
      
      // Find the best match
      let best = "doctor";
      for (const key in scores) {
        if (scores[key] > scores[best]) {
          best = key;
        }
      }
      
      const course12 = { 
        doctor: "Doctor / Medicine", 
        engineer: "Engineering / Technology", 
        social: "Social Service", 
        sports: "Sports / Athletics" 
      };
      
      // Store results
      localStorage.setItem("studentCourse", course12[best]);
      localStorage.setItem("studentLevel", "12th");
      
      // Redirect to results page
      window.location.href = "result 12th.html";
    }

    // Event listeners
    document.getElementById('next-btn').addEventListener('click', nextQuestion);
    document.getElementById('prev-btn').addEventListener('click', prevQuestion);
    document.getElementById('submit-btn').addEventListener('click', submitTest);

    // Initialize the quiz
    initQuiz();
  </script>
</body>
</html>
