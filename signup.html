<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f7ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .signup-container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .signup-container p.info {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
      text-align: center;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px 12px 45px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #777;
    }

    .code-group {
      display: flex;
      gap: 10px;
    }

    .code-group input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .send-btn {
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    .send-btn:hover {
      background: #f1f1f1;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-primary:hover {
      background: #3651c5;
    }

    .terms {
      font-size: 12px;
      text-align: center;
      color: #666;
      margin: 15px 0;
    }

    .terms a {
      color: #4361ee;
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    /* Back to login link */
    .login-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      text-decoration: none;
      color: #4361ee;
      font-weight: 500;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    /* Help button */
    .help-btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #4361ee;
      border-radius: 8px;
      background: white;
      color: #4361ee;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }

    .help-btn:hover {
      background: #f0f3ff;
    }
  </style>
</head>
<body>

  <div class="signup-container">
    <p class="info">
      Only email registration is supported in your region. One account is all you need to access our services.
    </p>

    <form>
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" placeholder="Email address" required>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" placeholder="Password" id="password" required>
        <i class="fas fa-eye" style="right:15px; left:auto; cursor:pointer;" onclick="togglePassword('password')"></i>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" placeholder="Confirm password" id="confirmPassword" required>
        <i class="fas fa-eye" style="right:15px; left:auto; cursor:pointer;" onclick="togglePassword('confirmPassword')"></i>
      </div>

      <div class="code-group">
        <input type="text" placeholder="Code" required>
        <button type="button" class="send-btn">Send code</button>
      </div>

      <div class="terms">
        By signing up, you consent to our
        <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.
      </div>

      <button type="submit" class="btn-primary">Sign up</button>

      <!-- Back to login link -->
      <a href="login.html" class="login-link">← Back to Login</a>

      <!-- Help button -->
      <a href="instruction.html" class="help-btn"><i class="fas fa-question-circle"></i> Need Help Creating an Account?</a>
    </form>
  </div>

  <script>
    function togglePassword(id) {
      const field = document.getElementById(id);
      field.type = field.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
